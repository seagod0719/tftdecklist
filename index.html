<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TFT 메타 애그리게이터</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif;
    }

    body {
      display: flex;
      min-height: 100vh;
      background-color: #f5f5f5;
      color: #333;
    }

    /* 좌측 사이드바 영역 */
    .sidebar {
      width: 240px;
      background-color: #fff;
      border-right: 2px solid #000; /* 스케치 느낌 살리기 */
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .sidebar h1 {
      font-size: 20px;
      text-align: center;
      margin-bottom: 40px;
      padding: 0 20px;
    }

    .menu-item {
      padding: 15px 24px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      border-left: 4px solid transparent;
      transition: background-color 0.2s;
    }

    .menu-item:hover, .menu-item.active {
      background-color: #f0f0f0;
      border-left-color: #222;
    }

    /* 우측 메인 콘텐츠 영역 */
    .main-content {
      flex: 1;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr); /* 정확히 3등분 */
      gap: 2px; /* 검은색 경계선 효과를 위한 여백 */
      background-color: #000; /* 바탕을 검은색으로 깔고 */
    }

    /* 각각의 사이트 컬럼 */
    .column {
      background-color: #fff; /* 내부를 하얗게 채워 경계선 만들기 */
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .site-title {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      padding: 15px;
      border: 2px solid #000;
      margin-bottom: 20px;
    }

    /* 티어 리스트 영역 */
    .tier-section h3 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 15px;
      color: #222;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tier-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tier-item {
      padding: 12px;
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
    }
    /* 덱 항목 내부 레이아웃 */
    .tier-item {
      padding: 12px;
      background-color: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .comp-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
    }

    .comp-units {
      font-size: 12px;
      color: #666;
      line-height: 1.4;
      word-break: keep-all;
    }

    /* 복사 버튼 */
    .copy-btn {
      padding: 4px 10px;
      font-size: 11px;
      background-color: #222;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.2s;
    }

    .copy-btn:hover {
      background-color: #555;
    }
  </style>
</head>
<body>

  <!-- 사이드바 -->
  <aside class="sidebar">
    <h1>TFT ALL-IN-ONE</h1>
    <div class="menu-item active">덱리스트</div>
    <div class="menu-item">유물리스트</div>
    <div class="menu-item">상징 리스트</div>
    <div class="menu-item">유닛 통계</div>
    <div class="menu-item">팀 빌더</div>
  </aside>

  <!-- 메인 영역 (3단 분할) -->
  <main class="main-content">
    
    <!-- 1. MetaTFT 컬럼 -->
    <div class="column">
      <div class="site-title">MetaTFT</div>
      
      <div class="tier-section">
        <h3><span style="color: #ff4e50;">SS</span> 리스트</h3>
        <ul class="tier-list" id="meta-ss-list">
          <li class="tier-item">로딩 중...</li>
        </ul>
      </div>
      
      <div class="tier-section">
        <h3><span style="color: #f9a826;">S</span> 리스트</h3>
        <ul class="tier-list" id="meta-s-list">
          <li class="tier-item">로딩 중...</li>
        </ul>
      </div>

      <div class="tier-section">
        <h3><span style="color: #4a90e2;">A</span> 리스트</h3>
        <ul class="tier-list" id="meta-a-list">
          <li class="tier-item">로딩 중...</li>
        </ul>
      </div>
    </div>

    <!-- 2. TFT Academy 컬럼 -->
    <div class="column">
      <div class="site-title">TFT Academy</div>
      
      <div class="tier-section">
        <h3><span style="color: #ff4e50;">SS</span> 리스트</h3>
        <ul class="tier-list" id="academy-ss-list">
          <li class="tier-item">로딩 중...</li>
        </ul>
      </div>
      
      <div class="tier-section">
        <h3><span style="color: #f9a826;">S</span> 리스트</h3>
        <ul class="tier-list" id="academy-s-list">
          <li class="tier-item">로딩 중...</li>
        </ul>
      </div>

      <div class="tier-section">
        <h3><span style="color: #4a90e2;">A</span> 리스트</h3>
        <ul class="tier-list" id="academy-a-list">
          <li class="tier-item">로딩 중...</li>
        </ul>
      </div>
    </div>

    <!-- 3. LOL QQ 컬럼 -->
    <div class="column">
      <div class="site-title">LOL QQ</div>
      
      <div class="tier-section">
        <h3><span style="color: #ff4e50;">SS</span> 리스트</h3>
        <ul class="tier-list" id="qq-ss-list">
          <li class="tier-item">로딩 중...</li>
        </ul>
      </div>
      
      <div class="tier-section">
        <h3><span style="color: #f9a826;">S</span> 리스트</h3>
        <ul class="tier-list" id="qq-s-list">
          <li class="tier-item">로딩 중...</li>
        </ul>
      </div>

      <div class="tier-section">
        <h3><span style="color: #4a90e2;">A</span> 리스트</h3>
        <ul class="tier-list" id="qq-a-list">
          <li class="tier-item">로딩 중...</li>
        </ul>
      </div>
    </div>

  </main>
<script>
    async function loadMetaTFT() {
      try {
        const response = await fetch('/api/metatft');
        const jsonData = await response.json();
        const comps = Object.values(jsonData.results.data.cluster_details);

        const ssList = document.getElementById('meta-ss-list');
        const sList = document.getElementById('meta-s-list');
        const aList = document.getElementById('meta-a-list');

        ssList.innerHTML = '';
        sList.innerHTML = '';
        aList.innerHTML = '';

        comps.forEach(comp => {
          // 덱 이름 정제
          let compName = comp.name_string || '이름 없는 덱';
          compName = compName.replace(/DA_18_|DA_|_AP|_AD|18/g, '').replace(/_/g, ' ');

          // 유닛 리스트 정제 (예: "Aphelios, Diana, Varus...")
          let unitsRaw = comp.units_string || '유닛 정보 없음';
          let cleanUnits = unitsRaw.replace(/DA_18_|DA_|_AP|_AD|18/g, '').replace(/_/g, ' ');

          const avgPlacement = comp.overall ? comp.overall.avg : 5.0;

          // HTML 요소 생성 (이름, 복사 버튼, 유닛 리스트)
          const li = document.createElement('li');
          li.className = 'tier-item';
          li.innerHTML = `
            <div class="comp-header">
              <span>${compName} <span style="font-weight:400; font-size:12px; color:#888;">(평균 ${avgPlacement.toFixed(2)}등)</span></span>
              <button class="copy-btn" onclick="copyTeam('${cleanUnits}')">유닛 복사</button>
            </div>
            <div class="comp-units">${cleanUnits}</div>
          `;

          if (avgPlacement < 4.2) {
            ssList.appendChild(li);
          } else if (avgPlacement < 4.4) {
            sList.appendChild(li);
          } else {
            aList.appendChild(li);
          }
        });
        
        if(ssList.children.length === 0) ssList.innerHTML = '<li class="tier-item">데이터 없음</li>';
        if(sList.children.length === 0) sList.innerHTML = '<li class="tier-item">데이터 없음</li>';
        if(aList.children.length === 0) aList.innerHTML = '<li class="tier-item">데이터 없음</li>';

      } catch (error) {
        console.error("MetaTFT 로딩 에러:", error);
        document.getElementById('meta-ss-list').innerHTML = '<li class="tier-item">불러오기 실패</li>';
      }
    }

    // 복사 버튼을 눌렀을 때 실행되는 함수
    function copyTeam(units) {
      navigator.clipboard.writeText(units).then(() => {
        alert('덱 유닛이 복사되었습니다!\\n' + units);
      }).catch(err => {
        alert('복사 중 오류가 발생했습니다.');
      });
    }

    window.onload = function() {
      loadMetaTFT();
    };
  </script>
</body>
</body>
</html>
